<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<title>Kasir WAY PAY</title>
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #eef2f3;
        padding: 15px;
        margin: 0;
    }
    .card {
        background: #fff;
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 15px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        max-width: 400px;
        margin-left: auto;
        margin-right: auto;
    }
    input, select {
        width: 100%;
        padding: 12px;
        margin: 6px 0 12px 0;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        font-family: inherit;
        font-size: 14px;
        box-sizing: border-box;
    }
    label {
        font-size: 13px;
        font-weight: bold;
        color: #333;
    }
    button {
        width: 100%;
        padding: 14px;
        border: 0;
        border-radius: 8px;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
        margin-bottom: 8px;
    }
    .btn-generate { background: #2c3e50; color: white; }
    .btn-print { background: #2980b9; color: white; }
    .btn-reset { background: #e74c3c; color: white; }
    
    #out {
        white-space: pre; 
        font-family: 'Courier New', Courier, monospace;
        background: #fdfdfd;
        border: 1px dashed #999;
        padding: 15px;
        margin-top: 10px;
        font-size: 13px;
        line-height: 1.4;
        overflow-x: auto;
    }
    .title {
        font-weight: bold;
        font-size: 20px;
        text-align: center;
        color: #2c3e50;
        margin-bottom: 15px;
    }
    .small { font-size: 12px; color: #666; font-family: monospace; }
    .riwayat-item { border-bottom: 1px dashed #ddd; padding: 10px 0; }
</style>
</head>
<body>

<div class="card">
    <div class="title">🧾 WAY PAY</div>

    <label>Layanan</label>
    <select id="layanan" onchange="aturForm()">
        <option value="Pulsa">Pulsa</option>
        <option value="Paket Data">Paket Data</option>
        <option value="Token Listrik">Token Listrik PLN</option>
        <option value="Top Up Ewallet">Top Up E-Wallet</option>
        <option value="Top Up Game">Top Up Game Online</option>
        <option value="Tarik Tunai">Tarik Tunai</option>
    </select>

    <label>Nama Produk / Detail</label>
    <input id="produk" placeholder="Cth: Telkomsel 50rb / Saldo Dana">
    
    <label>Nomor Tujuan / ID Pelanggan</label>
    <input id="tujuan" placeholder="Cth: 081234567890">

    <!-- Kolom Token (Muncul jika pilih Token Listrik) -->
    <div id="grupToken" style="display: none;">
        <label style="color: #d35400;">Nomor Token / SN</label>
        <input id="token" placeholder="Cth: 4091 8401 1234 5678">
    </div>

    <label>Harga (Rp)</label>
    <input type="number" id="harga" placeholder="Cth: 50000">

    <!-- Kolom Admin (Muncul jika Top Up / Tarik Tunai) -->
    <div id="grupAdmin" style="display: none;">
        <label>Biaya Admin (Rp)</label>
        <input type="number" id="admin" placeholder="Cth: 2000">
    </div>

    <label>Status Transaksi</label>
    <select id="status">
        <option value="BERHASIL">BERHASIL</option>
        <option value="PENDING">PENDING</option>
        <option value="GAGAL">GAGAL</option>
    </select>

    <!-- TOMBOL-TOMBOL UTAMA -->
    <div style="margin-top: 15px;">
        <button class="btn-generate" onclick="buat()">Generate Struk</button>
        <button class="btn-print" onclick="printBT()">PRINT OTOMATIS</button>
        <button class="btn-reset" onclick="resetForm()">Reset Form</button>
    </div>
</div>

<!-- PREVIEW STRUK -->
<div class="card">
    <div style="font-weight:bold; color:#666; font-size:14px; text-align:center;">Preview Struk</div>
    <div id="out"></div>
</div>

<!-- RIWAYAT TRANSAKSI -->
<div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px;">
        <b>Riwayat Transaksi</b>
        <button class="btn-reset" onclick="hapus()" style="width:auto; margin:0; padding:6px 12px; font-size: 12px;">Hapus</button>
    </div>
    <div id="history" class="small"></div>
</div>

<script>
// Menampilkan/Menyembunyikan Kolom Token & Admin
function aturForm() {
    let lay = document.getElementById("layanan").value;
    let grupToken = document.getElementById("grupToken");
    let grupAdmin = document.getElementById("grupAdmin");
    
    // Logika Token
    if(lay === "Token Listrik") {
        grupToken.style.display = "block";
    } else {
        grupToken.style.display = "none";
        document.getElementById("token").value = ""; 
    }

    // Logika Admin
    if(lay.includes("Top Up") || lay === "Tarik Tunai") {
        grupAdmin.style.display = "block";
    } else {
        grupAdmin.style.display = "none";
        document.getElementById("admin").value = ""; 
    }
}

function formatRp(angka) {
    return "Rp " + parseInt(angka || 0).toLocaleString('id-ID');
}

function idtrx(){
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let rand = '';
    for (let i = 0; i < 5; i++) {
        rand += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return "WP-" + rand;
}

function waktu(){
    let d = new Date();
    const day = String(d.getDate()).padStart(2, '0');
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const year = String(d.getFullYear()).slice(-2);
    const h = String(d.getHours()).padStart(2, '0');
    const m = String(d.getMinutes()).padStart(2, '0');
    return `${day}/${month}/${year} ${h}:${m}`;
}

// Menulis format struk
function buat(){
    let lay = document.getElementById("layanan").value;
    let prod = document.getElementById("produk").value || "-";
    let tuj = document.getElementById("tujuan").value || "-";
    let tok = document.getElementById("token").value;
    let hrg = parseInt(document.getElementById("harga").value) || 0;
    let adm = parseInt(document.getElementById("admin").value) || 0;
    let stat = document.getElementById("status").value;

    let total = hrg + adm;
    let trxId = idtrx();

    // Spasi ditambahkan agar nama toko dan alamat ada di tengah struk
    let teks = 
"            WAY PAY\n" +
"  Jl. Kp. Curug, Cibarusahkota\n" +
"  Kec. Cibarusah, Kab. Bekasi\n" +
"           Jawa Barat\n" +
"--------------------------------\n" +
"Tgl : " + waktu() + "\n" +
"Trx : " + trxId + "\n" +
"--------------------------------\n" +
"Layanan : " + lay + "\n" +
"Tujuan  : " + tuj + "\n" +
"Detail  : " + prod + "\n";

    if (tok !== "") {
        teks += "--------------------------------\n";
        teks += "TOKEN / SN :\n";
        teks += tok + "\n";
    }

    teks += "--------------------------------\n";

    if (lay.includes("Top Up") || lay === "Tarik Tunai") {
        teks += "Harga   : " + formatRp(hrg) + "\n";
        teks += "Admin   : " + formatRp(adm) + "\n";
    }

    teks += "Total   : " + formatRp(total) + "\n";
    teks += "Status  : " + stat + "\n";
    teks += "--------------------------------\n";
    teks += "          TERIMA KASIH\n";

    document.getElementById("out").textContent = teks;
    simpan(teks);
}

// Tombol Print Otomatis via RawBT
function printBT(){
    // Jika kolom preview kosong, buat struk otomatis dulu
    if(document.getElementById("out").textContent === ""){
        buat(); 
    }
    
    let text = document.getElementById("out").textContent;
    // Buka link URL Scheme RawBT
    window.location.href = "rawbt:print?text=" + encodeURIComponent(text);
}

// Reset semua kolom inputan
function resetForm() {
    document.querySelectorAll("input").forEach(i => i.value = "");
    document.getElementById("out").textContent = "";
    document.getElementById("layanan").value = "Pulsa";
    document.getElementById("status").value = "BERHASIL";
    aturForm(); // Kembalikan kolom tersembunyi seperti semula
}

function simpan(teks){
    let data = JSON.parse(localStorage.getItem("trx") || "[]");
    data.unshift(teks); 
    if(data.length > 10) data.pop(); // Maksimal simpan 10 terakhir
    localStorage.setItem("trx", JSON.stringify(data));
    tampil();
}

function tampil(){
    let data = JSON.parse(localStorage.getItem("trx") || "[]");
    let html = "";
    data.forEach(x => {
        html += `<div class="riwayat-item">${x.replace(/\n/g, "<br>")}</div>`;
    });
    document.getElementById("history").innerHTML = html;
}

function hapus(){
    if(confirm("Hapus semua riwayat transaksi?")) {
        localStorage.removeItem("trx");
        tampil();
    }
}

// Inisialisasi awal saat web dibuka
window.onload = function() {
    aturForm();
    tampil();
};
</script>

</body>
</html>
